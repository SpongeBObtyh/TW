[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transparent-window"
version = "0.1.0"
description = "A Windows tray utility for revealing windows through a mouse-following circular opening."
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2"]
packaging = ["pyinstaller>=6.10,<7; sys_platform == 'win32'"]

[project.scripts]
transparent-window = "transparent_window.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
